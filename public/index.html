<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09827e">
<title>Vinted Niche Watch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309827e'/%3E%3Cpath d='M9 17l4 4 10-11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --brand:#09827e; --brand-strong:#066b68; --brand-soft:#e3f3f2;
  --bg:#f4f6f6; --card:#ffffff; --text:#14201f; --muted:#5f6f6e; --line:#e2e8e7;
  --input:#fbfcfc; --hit:#fff1e0; --hit-line:#f59e0b; --hit-text:#9a4b00;
  --ok:#0e9f6e; --warn:#d97706; --err:#dc2626;
  --shadow:0 1px 2px rgba(16,40,38,.06),0 4px 16px rgba(16,40,38,.06);
  --radius:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --brand:#16a6a0; --brand-strong:#3cc2bc; --brand-soft:#0f2e2d;
    --bg:#0d1414; --card:#151f1f; --text:#e5eeed; --muted:#8fa3a1; --line:#243231;
    --input:#111a1a; --hit:#3a2a12; --hit-line:#f59e0b; --hit-text:#fbbf6a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px;}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--text);white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo small{font-weight:500;color:var(--muted);font-size:12px;display:block;line-height:1}
nav{margin-left:auto;display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
nav a{padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px}
nav a.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
nav a:hover{text-decoration:none}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:1px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid var(--line)}
.card h2{margin:0 0 14px;font-size:17px}
.card h3{margin:0 0 10px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid>*{min-width:0}
@media (max-width:860px){.g2{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=url]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--text);font:inherit;}
input:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);border-color:var(--brand)}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--brand-soft);color:var(--brand-strong);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.gray{background:var(--bg);color:var(--muted)}
.chip.orange{background:var(--hit);color:var(--hit-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 20px;font:600 15px system-ui,sans-serif;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none}
.btn:hover{background:var(--brand-strong);text-decoration:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--err)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text);font-weight:500;cursor:pointer;margin:0}
.check input{width:18px;height:18px;accent-color:var(--brand);margin-top:1px}
.err{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.notice{background:var(--brand-soft);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.warnbox{background:var(--hit);color:var(--hit-text);border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px}
/* progression */
.phase{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.phase b{font-size:16px}
.track{position:relative;height:14px;border-radius:99px;background:var(--bg);overflow:hidden;display:flex}
.seg{position:relative;height:100%;overflow:hidden}
.seg+.seg{border-left:2px solid var(--card)}
.seg .fill{position:absolute;inset:0 auto 0 0;background:var(--brand);transition:width .6s}
.seg.win .fill{background:var(--hit-line)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--brand);margin-right:5px}
.legend span.w::before{background:var(--hit-line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.stats.five{grid-template-columns:repeat(5,1fr)}
@media (max-width:700px){.stats,.stats.five{grid-template-columns:1fr 1fr}}
.stat{background:var(--bg);border-radius:12px;padding:12px 14px;min-width:0}
.stat .v{font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.api{font-size:14px;font-weight:600;line-height:1.3;margin-top:4px}
.api::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--muted)}
.api.ok::before{background:var(--ok)} .api.warn::before{background:var(--warn)} .api.error::before{background:var(--err)}
.api.warn{color:var(--warn)} .api.error{color:var(--err)}
/* top annonces */
.items{display:grid;gap:10px}
.it{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.it:hover{text-decoration:none;border-color:var(--brand)}
.it.hit{background:var(--hit);border-color:var(--hit-line)}
.it img{width:52px;height:68px;object-fit:cover;border-radius:8px;background:var(--bg);flex:none}
.it .rk{width:22px;text-align:center;font-weight:700;color:var(--muted);flex:none}
.it .mid{flex:1;min-width:0}
.it .mid>span{display:block}
.it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12px;color:var(--muted)}
.it .f{text-align:right;flex:none}
.it .f b{font-size:20px;display:block;line-height:1.1}
.it .f span{font-size:11px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--card);user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
th.sorted{color:var(--brand)}
th .ar{font-size:10px;margin-left:3px}
td.n,th.n{text-align:right}
td.title{max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr.hit td{background:var(--hit)}
tr.hit td:first-child{box-shadow:inset 3px 0 var(--hit-line)}
td img{width:34px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle;background:var(--bg)}
.score{font-weight:700;color:var(--brand)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap;display:inline-block}
.tag.hit{background:var(--hit-line);color:#fff}
.tag.p{background:var(--bg);color:var(--muted)}
.tag.hot{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}
.it.hot{border-color:var(--err)}
/* historique */
.hist{display:grid;gap:12px}
.h{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.h .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.h .meta{font-size:13px;color:var(--muted);margin-top:4px}
.demand{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.demand b{color:var(--text);font-size:15px}
.st{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.03em}
.st.done{background:var(--brand-soft);color:var(--brand-strong)}
.st.running{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.st.stopped,.st.interrupted{background:var(--bg);color:var(--muted)}
.st.error{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
@media (max-width:560px){
  .h{grid-template-columns:1fr}
  .logo small{display:none}
  nav a{padding:7px 10px}
  .card{padding:16px}
  main{padding:12px 12px 50px}
}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.kv div{background:var(--bg);border-radius:10px;padding:9px 12px}
.kv b{display:block;font-size:17px}
.kv span{font-size:12px;color:var(--muted);font-weight:600}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#veille"><i><svg width="18" height="18" viewBox="0 0 32 32"><path d="M7 17l5 5 13-13" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      <span>Niche Watch<small>Vinted</small></span></a>
    <nav>
      <a href="#veille" id="nav-veille">Veille<span id="navdot" class="live-dot hidden"></span></a>
      <a href="#historique" id="nav-historique">Historique</a>
    </nav>
  </div>
</header>
<main id="app"></main>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = (x, d = 0) => x == null || x === "" ? "–" : Number(x).toLocaleString("fr-FR", {maximumFractionDigits: d, minimumFractionDigits: 0});
const eur = x => x == null ? "–" : Number(x).toLocaleString("fr-FR", {style: "currency", currency: "EUR", maximumFractionDigits: 2});
const dt = t => t ? new Date(t * 1000).toLocaleString("fr-FR", {day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"}) : "–";
const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h} h ${String(m).padStart(2, "0")}` : m ? `${m} min ${String(ss).padStart(2, "0")}` : `${ss} s`; };
const STATUS = {running: "En cours", done: "Terminée", stopped: "Arrêtée", interrupted: "Interrompue", error: "Erreur"};

const KEY_STORE = "vnw-key";
const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } };
const withKey = url => getKey() ? `${url}${url.includes("?") ? "&" : "?"}key=${encodeURIComponent(getKey())}` : url;
let INFO = {serverless: false};

async function api(path, opts = {}) {
  if (INFO.storage === "browser") { const res = await localRoute(path, opts); if (res !== undefined) return res; }
  return serverApi(path, opts);
}
async function serverApi(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", "X-App-Key": getKey()}});
  if (r.status === 401) { showLogin(); throw new Error("Mot de passe requis"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    let msg = data.detail;
    if (Array.isArray(msg)) msg = msg.map(e => `${(e.loc || []).slice(-1)[0]} : ${e.msg}`).join(" · ");
    throw new Error(msg || `Erreur ${r.status}`);
  }
  return data;
}

/* ====================================================================================
   MODE NAVIGATEUR (Vercel sans base de données)
   Le serveur ne fait que les appels Vinted (/api/scan). Le suivi des annonces, les calculs
   et l'historique sont gérés ici et stockés dans IndexedDB (sur cet appareil uniquement).
   Même logique que app/tracker.py.
   ==================================================================================== */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open("vinted-niche-watch", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const tx = db.transaction("kv", mode), st = tx.objectStore("kv"); const req = fn(st);
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  }));
  return {get: k => run("readonly", s => s.get(k)), set: (k, v) => run("readwrite", s => s.put(v, k)),
          del: k => run("readwrite", s => s.delete(k))};
})();

const L = {
  MAX_STALE: 5 * 60,
  clockOffset: 0,
  realNow() { return Date.now() / 1000 + this.clockOffset; },
  clockNow(s) { return s.demo ? s.demo_t0 + (this.realNow() - s.demo_t0) * s.speed : this.realNow(); },
  async index() { return (await IDB.get("index")) || []; },
  async load(id) { return IDB.get("s" + id); },
  async save(rec) {
    await IDB.set("s" + rec.s.id, rec);
    const idx = await this.index(), meta = this.meta(rec);
    const i = idx.findIndex(x => x.id === rec.s.id);
    if (i >= 0) idx[i] = meta; else idx.unshift(meta);
    await IDB.set("index", idx);
  },
  meta(rec) {
    const s = rec.s, items = Object.values(rec.items);
    const en = enrich(items.map(i => ({...i})), s.window_min, s.hit_threshold);
    return {...s, calib: undefined, n_items: items.length, ...sessionSummary(en, s)};
  },
  async running() {
    const idx = await this.index(), m = idx.find(x => x.status === "running");
    return m ? this.load(m.id) : null;
  },

  async start(b) {
    let f;
    if (b.url) {
      if (!b.url.includes("vinted.")) throw new Error("L'URL doit être une recherche vinted.fr.");
      f = (await serverApi("/api/parse-url", {method: "POST", body: JSON.stringify({url: b.url})})).filters;
    } else f = {catalog_ids: [], price_from: null, price_to: null, brand_ids: [], size_ids: [], status_ids: [], search_text: ""};
    const ids = (b.catalog_id || "").replace(/;/g, ",").split(",").map(x => x.trim()).filter(x => /^\d+$/.test(x)).map(Number);
    if (ids.length) f.catalog_ids = ids;
    if (b.price_min != null) f.price_from = b.price_min;
    if (b.price_max != null) f.price_to = b.price_max;
    if (!(f.catalog_ids.length || f.search_text || f.brand_ids.length) && !b.demo) throw new Error("Indique une URL de recherche ou un ID de catégorie.");
    if (f.price_from != null && f.price_to != null && f.price_from > f.price_to) throw new Error("Le prix min est supérieur au prix max.");
    const cur = await this.running();
    if (cur) { await this.finalizeIfStale(cur); if (await this.running()) throw new Error("Une veille est déjà en cours. Arrête-la d'abord."); }
    const idx = await this.index(), id = (idx.reduce((m, x) => Math.max(m, x.id), 0)) + 1;
    const real = this.realNow(), dur_ = b.duration_min, win = b.window_min;
    const s = {id, created_at: real, start_ts: real, capture_end: real + dur_ * 60, final_end: real + (dur_ + win) * 60,
      ended_at: null, status: "running", demo: b.demo ? 1 : 0, speed: b.demo ? INFO.demo_speed : 1, demo_t0: b.demo ? real : null,
      seed: Math.floor(Math.random() * 1e9) + 1, filters: f, filters_label: filtersLabel(f), duration_min: dur_, window_min: win,
      hit_threshold: b.threshold, interval_s: Math.max(45, b.interval_s), cycles: 0, requests: 0, next_tick_at: 0,
      last_cycle_at: null, id_floor: null, max_seen_id: null, calib: [], backoff_i: 0, api_level: "ok", api_text: "Démarrage… premier scan imminent",
      last_cycle: {}, warnings: [], summary: null};
    await this.save({s, items: {}, cookies: null, snaps: 0});
    return {session_id: id};
  },

  async finish(rec, status) {
    const s = rec.s;
    s.status = status; s.ended_at = this.realNow(); s.api_level = "idle"; rec.cookies = null;
    s.api_text = {done: "Veille terminée", stopped: "Veille arrêtée", error: "Veille arrêtée sur erreur",
                  interrupted: "Veille interrompue (plus aucun scan)"}[status];
    await this.save(rec);
  },
  async finalizeIfStale(rec) {
    if (this.clockNow(rec.s) > rec.s.final_end + this.MAX_STALE) {
      await this.finish(rec, (rec.s.last_cycle_at || 0) >= rec.s.final_end ? "done" : "interrupted"); return true;
    }
    return false;
  },
  async stop() { const r = await this.running(); if (r) await this.finish(r, "stopped"); return {ok: true}; },

  busy: false,
  async tick() {   // verrou inter-onglets : un seul scan à la fois sur cet appareil
    if (navigator.locks) return navigator.locks.request("vnw-tick", {ifAvailable: true}, lock => lock ? this._tick() : {ran: false});
    return this._tick();
  },
  async _tick() {
    if (this.busy) return {ran: false};
    const rec = await this.running();
    if (!rec) return {ran: false};
    if (await this.finalizeIfStale(rec)) return {ran: false};
    const s = rec.s;
    if (this.clockNow(s) < s.next_tick_at) return {ran: false};
    this.busy = true;
    try {
      const baseline = s.id_floor == null, now0 = this.clockNow(s), W0 = s.window_min * 60;
      // Annonces dont la mesure n'est pas finie : le serveur pagine jusqu'à les avoir toutes revues.
      const activeItems = baseline ? [] : Object.values(rec.items).filter(i => now0 - i.posted_at <= W0 + 150);
      const active = activeItems.map(i => i.item_id);
      // [id, prix] : le serveur découpe en tranches de prix si trop d'annonces à suivre pour 10 pages.
      // Profondeur à parcourir = rythme de mise en ligne observé × âge de la plus ancienne annonce active (cf. tracker.needed_depth).
      let depth = 0;
      if (activeItems.length) {
        const all = Object.values(rec.items), elapsed = Math.max(60, Math.min(now0, s.capture_end) - s.start_ts);
        const rate = all.filter(i => i.posted_at <= s.capture_end).length / (elapsed / 60);
        const oldest = Math.max(...activeItems.map(i => now0 - i.posted_at)) / 60;
        depth = Math.round(Math.max(activeItems.length + 150, rate * oldest * 1.1 + 50));
      }
      const expect_new = !baseline && !!s.calib?.length && now0 - s.calib[s.calib.length - 1][0] > 100;   // nouveau lot attendu
      const body = {filters: s.filters, active: activeItems.map(i => [i.item_id, i.price]), depth, expect_new, max_seen: s.max_seen_id, baseline, cookies: rec.cookies,
                    demo: s.demo ? {seed: s.seed, now: now0, speed: s.speed, request_no: s.requests} : null};
      let r;
      try { r = await serverApi("/api/scan", {method: "POST", body: JSON.stringify(body)}); }
      catch (e) { r = {status: "error", message: e.message, items: [], requests: 0, pages: 0, warnings: []}; }
      const fresh = await this.load(s.id);           // la veille a pu être arrêtée pendant le scan
      if (!fresh || fresh.s.status !== "running") return {ran: false};
      Object.assign(rec, fresh); const S = rec.s;
      const W = S.window_min * 60; let nNew = 0;
      const ids = r.items.filter(i => !i.promoted).map(i => i.item_id);
      if (baseline) {
        // Scan de référence : tout ce qui est déjà en ligne est ignoré (ID <= plancher).
        if (r.max_first) { S.id_floor = Math.max(...ids); S.max_seen_id = S.id_floor; S.calib = [[r.t_first, S.id_floor]]; }
      } else {

/* --- mesure de la demande : port exact de app/measure.py --- */

  STD: [5, 10, 15], TOL_BEFORE: 30, TOL_AFTER: 60, MAX_GAP: 300, HOT_MIN_AGE: 120, HOT_EXPONENT: 0.75, GONE_WEIGHT: 3, HIT_WEIGHT: 2,

  updateCps(cps, age, favs, w) {

  },
  cpValue(e, c) {   // [favoris au palier, mesure complète ?]

    if (ab != null && t - ab <= this.TOL_BEFORE) return [fb, true];

    const early = wf != null && wa != null && wa < w - this.TOL_BEFORE && !it.in_progress;

      fav_mean: favs.length ? r1(mean(favs), 1) : 0, fav_median: med, fav_max: favs.length ? Math.max(...favs) : 0,
      price_mean: prices.length ? r1(mean(prices), 2) : null, score: r1(med * Math.min(n, 5) / 5 + M.HIT_WEIGHT * hits + M.GONE_WEIGHT * gone, 2)};

  const blob = new Blob(["﻿" + rows.map(r => r.map(cell).join(";")).join("\r\n")], {type: "text/csv;charset=utf-8"});

      ...d.brands.map((b, n) => [n + 1, b.brand, b.n_items, b.hits, csvNum(b.hit_rate, 1), csvNum(b.fav_mean, 1), csvNum(b.fav_median, 1), b.fav_max, csvNum(b.price_mean), csvNum(b.score), b.gone || 0])],

      ...d.items.map(i => [i.item_id, i.title, i.brand, csvNum(i.price), i.currency, i.size, i.condition, csvDate(i.posted_at), ...cps.map(c => csvNum(i.cp_values?.[c])),

/* --- aiguillage : en mode navigateur, les routes « à état » sont servies par L --- */
async function localRoute(path, opts) {
  const m = (opts.method || "GET").toUpperCase(), body = opts.body ? JSON.parse(opts.body) : null;
  let x;
  if (path === "/api/state") return L.state();
  if (path === "/api/start") return L.start(body);
  if (path === "/api/stop") return L.stop();
  if (path === "/api/tick") return L.tick();
  if (path === "/api/sessions") return L.sessions();
  if ((x = path.match(/^\/api\/sessions\/(\d+)$/))) return m === "DELETE" ? L.del(+x[1]) : L.detail(+x[1]);
  return undefined;
}

/* ---------- table triable ---------- */
const sortState = {};
function table(id, cols, rows, defKey, rowClass) {
  // Vinted ne fournit plus le nombre de vues (toujours 0) : colonne masquée dans ce cas.
  cols = cols.filter(c => !c.hideIfZero || rows.some(r => r[c.key]));
  const st = sortState[id] ||= {key: defKey, dir: -1};
  const col = cols.find(c => c.key === st.key) || cols[0];
  const val = r => col.sort ? col.sort(r) : r[col.key];
  const sorted = [...rows].sort((a, b) => {
    let x = val(a), y = val(b);
    if (x == null) return 1; if (y == null) return -1;
    if (typeof x === "string") return st.dir * x.localeCompare(y, "fr", {sensitivity: "base"});
    return st.dir * (x - y);
  });
  const th = cols.map(c => `<th data-k="${c.key}" class="${c.nosort ? "" : "sortable"} ${c.num ? "n" : ""} ${c.key === st.key ? "sorted" : ""}">${c.label}${c.key === st.key ? `<span class="ar">${st.dir < 0 ? "▼" : "▲"}</span>` : ""}</th>`).join("");
  const body = sorted.map(r => `<tr class="${rowClass ? rowClass(r) : ""}">${cols.map(c => `<td class="${c.num ? "n" : ""} ${c.cls || ""}">${c.fmt ? c.fmt(r) : esc(r[c.key])}</td>`).join("")}</tr>`).join("");
  return `<div class="tw" data-table="${id}"><table><thead><tr>${th}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="empty">Aucune donnée pour l'instant.</td></tr>`}</tbody></table></div>`;
}
function bindTables(root, rerender) {
  root.querySelectorAll("[data-table] th.sortable").forEach(th => th.onclick = () => {
    const id = th.closest("[data-table]").dataset.table, st = sortState[id], k = th.dataset.k;
    if (st.key === k) st.dir = -st.dir; else { st.key = k; st.dir = typeof k === "string" && ["brand", "title"].includes(k) ? 1 : -1; }
    rerender();
  });
}

  {key: "hot", label: "🔥", num: true, hideIfZero: true, fmt: r => r.hot ? `<b style="color:var(--err)">${r.hot}</b>` : "0"},
];
const brandRows = bs => bs.map((b, i) => ({...b, _rank: i + 1}));
const brandRowClass = r => r.hits > 0 ? "hit" : "";

const hotTag = i => i.hot ? `<span class="tag hot" title="Rythme de favoris qui mène au seuil avant la fin de la fenêtre">🔥 en chauffe</span>` : "";
function measureTag(i) {
  if (!i.measured) return `<span class="tag p">non mesurée</span>`;
  if (i.in_progress) return i.hot ? hotTag(i) : `<span class="tag p">en cours</span>`;
  if (i.gone) return `<span class="tag hit" style="background:var(--ok)" title="Disparue des résultats avant la fin de sa fenêtre : vendue, réservée ou retirée">vendue ?</span>`;
  if (i.partial) return `<span class="tag p" title="Relevé pris avant la fin de la fenêtre">partielle</span>`;
  return "";
}
function itemCols(win, cps, live) {
  const tags = i => `${i.is_hit ? '<span class="tag hit">HIT</span>' : ""} ${measureTag(i)}`;
  return [
    {key: "photo", label: "", nosort: true, fmt: i => i.photo_url ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(i.photo_url)}" alt="">` : ""},
    {key: "brand", label: "Marque", fmt: i => `<b>${esc(i.brand)}</b>`},
    {key: "rank_value", label: live ? "Demande" : `Fav. ${win} min`, num: true,
     fmt: i => `<b>${nf(i.in_progress ? i.last_fav : i.window_fav)}</b>${i.in_progress && i.projected != null ? ` <span class="muted small">→ ~${nf(i.projected)}</span>` : ""} ${tags(i)}`},
    {key: "favs_per_min", label: "Fav./min", num: true, fmt: i => nf(i.favs_per_min, 2)},
    // Un palier par colonne : favoris exacts à 5, 10, 15 min (interpolés entre deux relevés).
    ...cps.filter(c => c !== win).map(c => ({key: "cp_" + c, label: `à ${c} min`, num: true, sort: i => i.cp_values?.[c], fmt: i => nf(i.cp_values?.[c])})),
    {key: "price", label: "Prix", num: true, fmt: i => eur(i.price)},
    {key: "title", label: "Titre", cls: "title", fmt: i => `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title || "Annonce")}</a>`},
    {key: "size", label: "Taille"},
    {key: "posted_at", label: "En ligne", fmt: i => new Date(i.posted_at * 1000).toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"})},
  ];
}

/* ---------- écran Veille ---------- */
let lastState = null;

/* Sur Vercel, rien ne tourne en fond : c'est la page ouverte qui déclenche les scans. */
let tickInFlight = false, demoKick = null;
function kick() {
  if (tickInFlight) return;
  tickInFlight = true;
  api("/api/tick", {method: "POST"}).catch(() => {}).finally(() => { tickInFlight = false; });
}
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && lastState?.running) { keepAwake(true); route(); } });

  $("#login").onsubmit = e => { e.preventDefault(); try { localStorage.setItem(KEY_STORE, $("#pw").value); } catch {} route(); };

async function viewWatch(token) {
  let s;
  try { s = await api("/api/state"); } catch (e) { if (token !== renderToken) return; $("#app").innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  if (token !== renderToken) return;
  lastState = s;
  $("#navdot").classList.toggle("hidden", !s.running);
  if (s.running) { ALERTS.process(s); return renderLive(s, token); }

}

/* ---------- alertes : son + vibration + notification quand une annonce chauffe ou devient un hit ---------- */
const ALERTS = {
  on: (() => { try { return localStorage.getItem("vnw-alerts") === "1"; } catch { return false; } })(),
  seen: new Set(), sid: null, recent: [], ctx: null,
  async toggle(s) {
    this.on = !this.on;
    try { localStorage.setItem("vnw-alerts", this.on ? "1" : "0"); } catch {}
    if (this.on) {
      try { this.ctx ||= new (window.AudioContext || window.webkitAudioContext)(); await this.ctx.resume(); } catch {}
      if ("Notification" in window && Notification.permission === "default") { try { await Notification.requestPermission(); } catch {} }
      for (const a of s.alerts || []) this.seen.add(`${s.session.id}:${a.item_id}:${a.kind}`);   // pas d'avalanche à l'activation
      this.beep(1);
    }
  },
  beep(n = 2) {
    try {
      this.ctx ||= new (window.AudioContext || window.webkitAudioContext)();
      for (let k = 0; k < n; k++) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime + k * 0.22;
        o.frequency.value = 880 + k * 220; o.connect(g); g.connect(this.ctx.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.start(t); o.stop(t + 0.2);
      }
    } catch {}
  },
  async notify(title, body, url, tag) {
    try {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) await reg.showNotification(title, {body, tag, data: {url}, icon: "/favicon.svg"});   // Android : passe par le service worker
      else { const n = new Notification(title, {body, tag}); n.onclick = () => window.open(url, "_blank"); }
    } catch {}
  },
  process(s) {
    if (this.sid !== s.session.id) { this.sid = s.session.id; this.seen.clear(); this.recent = []; for (const a of s.alerts || []) this.seen.add(`${s.session.id}:${a.item_id}:${a.kind}`); return; }
    const fresh = (s.alerts || []).filter(a => !this.seen.has(`${s.session.id}:${a.item_id}:${a.kind}`));
    for (const a of fresh) {
      this.seen.add(`${s.session.id}:${a.item_id}:${a.kind}`);
      const title = a.kind === "hit" ? `🎯 HIT — ${a.brand} : ${a.favs} fav. en ${nf(a.age_min, 0)} min` : `🔥 ${a.brand} en chauffe : ${a.favs} fav. en ${nf(a.age_min, 0)} min`;
      const body = `${eur(a.price)}${a.projected ? ` · projection ~${a.projected} fav. à ${s.session.window_min} min` : ""}`;
      this.recent.unshift({...a, title, body, at: Date.now()}); this.recent = this.recent.slice(0, 6);
      if (this.on) { this.notify(title, body, a.url, `${a.item_id}:${a.kind}`); }
    }
    if (this.on && fresh.length) { this.beep(fresh.some(a => a.kind === "hit") ? 3 : 2); try { navigator.vibrate?.([180, 80, 180]); } catch {} }
  },
};
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js").catch(() => {});

function renderLive(s, token) {
  const se = s.session, win = se.window_min;
  const capFrac = se.duration_min / (se.duration_min + se.window_min);

  const speed = s.speed || 1;

  const lc = s.last_cycle || {};
  $("#app").innerHTML = `
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <div><h2 style="margin:0">Veille #${se.id} ${s.demo ? `<span class="chip orange">DÉMO ×${s.speed}</span>` : ""}</h2>

      <span class="spacer"></span>
      <button class="btn ${ALERTS.on ? "" : "ghost"} sm" id="alerts" title="Son, vibration et notification quand une annonce chauffe ou devient un hit">${ALERTS.on ? "🔔 Alertes activées" : "🔕 Activer les alertes"}</button>
      <a class="btn ghost sm" href="#session/${se.id}">Tableau complet</a>
      <button class="btn danger sm" id="stop">■ Arrêter</button>
    </div>
    <div class="phase"><b>${phaseLabel}</b><span class="muted small">reste ${dur(s.remaining_s / speed)}${s.demo ? " (réel)" : ""} · ${Math.round(s.progress * 100)} %</span></div>
    <div class="track">
      <div class="seg" style="width:${capFrac * 100}%"><div class="fill" style="width:${capFill * 100}%"></div></div>
      <div class="seg win" style="width:${(1 - capFrac) * 100}%"><div class="fill" style="width:${winFill * 100}%"></div></div>
    </div>
    <div class="legend"><span>Captation ${se.duration_min} min</span><span class="w">Fenêtre de fin ${win} min</span></div>
    <div class="stats five">
      <div class="stat"><div class="l">Annonces suivies</div><div class="v">${nf(s.n_items)}</div></div>
      <div class="stat"><div class="l">Hits (≥ ${se.hit_threshold} fav.)</div><div class="v" style="color:var(--hit-line)">${nf(s.n_hits)}</div>${s.n_gone ? `<div class="small" style="color:var(--ok)">+ ${s.n_gone} vendue(s) ?</div>` : ""}</div>
      <div class="stat"><div class="l">🔥 En chauffe</div><div class="v" style="color:var(--err)">${nf(s.n_hot)}</div></div>
      <div class="stat"><div class="l">Statut API</div><div class="api ${s.api.level}">${esc(s.api.text)}</div></div>
      <div class="stat"><div class="l">Cycles</div><div class="v">${nf(se.cycles)}</div><div class="small muted">${nxt}${lc.pages ? ` · dernier : ${lc.pages} p.${lc.bands > 1 ? ` (${lc.bands} tranches de prix)` : ""}, +${lc.new}${lc.missed ? `, ${lc.missed} non revues` : ""}` : ""}</div></div>
    </div>
    ${s.stalled ? `<div class="warnbox">⏸ Veille en pause : aucun scan récent. ${INFO.serverless ? "Sur Vercel, garde cette page ouverte (écran allumé) ou configure un cron externe (voir README)." : ""}</div>` : ""}
    ${INFO.serverless ? `<div class="hint" style="margin-top:10px">ℹ Les scans sont déclenchés par cette page : garde-la ouverte${navigator.wakeLock ? " (l'écran reste allumé)" : ""}${INFO.storage === "browser" ? "" : ", ou utilise un cron externe"}.</div>` : ""}
    ${(s.warnings || []).map(w => `<div class="warnbox">⚠ ${esc(w)}</div>`).join("")}
  </div>
  ${ALERTS.recent.length ? `<div class="card"><h3>Dernières alertes</h3><div class="items">${ALERTS.recent.map(a => `<a class="it ${a.kind === "hit" ? "hit" : "hot"}" href="${esc(a.url)}" target="_blank" rel="noopener"><span class="mid"><span class="t">${esc(a.title)}</span><span class="s">${esc(a.body)} · ${new Date(a.at).toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"})}</span></span></a>`).join("")}</div></div>` : ""}
  <div class="grid g2">
    <div class="card"><h2>Top demande</h2><div class="hint" style="margin:-8px 0 12px">Annonces jeunes : favoris actuels et projection à ${win} min. Annonces terminées : favoris à ${win} min.</div>
      <div class="items">${s.top_items.length ? s.top_items.map((i, n) => itemCard(i, n + 1, win)).join("") : `<div class="empty">En attente des premières annonces postées après le lancement…</div>`}</div></div>
    <div class="card"><h2>Top marques</h2><div id="tb"></div></div>
  </div>`;
  const drawBrands = () => {
    const cols = BRAND_COLS.filter(c => ["rank", "brand", "score", "n_items", "hits", "hot", "fav_median", "price_mean"].includes(c.key));
    $("#tb").innerHTML = table("live-brands", cols, brandRows(s.top_brands), "score", brandRowClass);
    bindTables($("#tb"), drawBrands);
  };
  drawBrands();
  $("#alerts").onclick = async () => { await ALERTS.toggle(s); renderLive(s, token); };
  $("#stop").onclick = async () => {
    if (!confirm("Arrêter la veille ? Les données déjà collectées sont conservées.")) return;
    $("#stop").disabled = true; $("#stop").textContent = "Arrêt…";
    await api("/api/stop", {method: "POST"}).catch(() => {});
    location.hash = `#session/${se.id}`;
  };
  kick(); keepAwake(true);
  if (s.demo && !demoKick) demoKick = setInterval(() => { if (lastState?.running) kick(); else { clearInterval(demoKick); demoKick = null; } }, 200);
  pollTimer = setTimeout(() => { if (token === renderToken) viewWatch(token); }, s.demo ? 1000 : 5000);
}

/* ---------- résultats d'une session ---------- */

  $("#navdot").classList.toggle("hidden", !d.live);
  const hits = d.items.filter(i => i.is_hit).length, partial = d.items.filter(i => i.partial).length, gone = d.items.filter(i => i.gone).length;
  const f = s.filters;
  $("#app").innerHTML = `
  <div class="card">
    <div class="row">
      <div><a href="#historique" class="small">← Historique</a>
      <h2 style="margin:4px 0 2px">Veille #${s.id} <span class="st ${s.status}">${STATUS[s.status] || s.status}</span> ${s.demo ? '<span class="chip orange">DÉMO</span>' : ""}</h2>

      ${INFO.storage === "browser"
        ? `<button class="btn ghost sm" data-exp="brands">⇩ CSV marques</button><button class="btn ghost sm" data-exp="items">⇩ CSV annonces</button>`
        : `<a class="btn ghost sm" href="${withKey(`/api/sessions/${s.id}/export/brands.csv`)}">⇩ CSV marques</a>
      <a class="btn ghost sm" href="${withKey(`/api/sessions/${s.id}/export/items.csv`)}">⇩ CSV annonces</a>`}
      ${d.live ? "" : `<button class="btn ghost sm" id="del" title="Supprimer">🗑</button>`}
    </div>
    <div class="kv">
      <div><span>Annonces</span><b>${nf(d.items.length)}</b></div>
      <div><span>Hits ≥ ${s.hit_threshold}</span><b style="color:var(--hit-line)">${nf(hits)} <small class="muted">(${nf(d.items.length ? 100 * hits / d.items.length : 0, 1)} %)</small></b></div>
      <div><span>Fav. médians à ${win} min</span><b>${nf(median(d.items.filter(i => i.window_fav != null && !i.partial).map(i => i.window_fav)), 1)}</b></div>
      <div><span>Marques</span><b>${nf(d.brands.length)}</b></div>
      <div><span>Durée / fenêtre</span><b>${s.duration_min} / ${win} min</b></div>
      <div><span>Cycles · requêtes</span><b>${nf(s.cycles)} · ${nf(s.requests)}</b></div>
      <div><span>Relevés</span><b>${nf(s.n_snapshots)}</b></div>
    </div>
    ${f.catalog_ids?.length ? `<div class="chips"><span class="chip gray">catalog : ${f.catalog_ids.join(", ")}</span>${f.brand_ids?.length ? `<span class="chip gray">brand_ids : ${f.brand_ids.join(", ")}</span>` : ""}${f.size_ids?.length ? `<span class="chip gray">size_ids : ${f.size_ids.join(", ")}</span>` : ""}${f.status_ids?.length ? `<span class="chip gray">status_ids : ${f.status_ids.join(", ")}</span>` : ""}</div>` : ""}
    ${gone ? `<div class="notice" style="margin-top:10px"><span>🟢 ${gone} annonce(s) ont disparu des résultats avant la fin de leur fenêtre : probablement <b>vendues</b> (ou réservées / retirées). Signal de forte demande.</span></div>` : ""}
    ${partial ? `<div class="warnbox">${partial} mesure(s) partielle(s) : le dernier relevé a été pris avant la fin des ${win} min (veille arrêtée, pause API…). Les favoris réels sont probablement plus élevés.</div>` : ""}
    ${(s.warnings || []).map(w => `<div class="warnbox">⚠ ${esc(w)}</div>`).join("")}
  </div>
  <div class="card"><h2>Classement des marques</h2><div id="tb"></div>
    <div class="hint">Vinted ne publie plus l'heure de mise en ligne : elle est estimée d'après le numéro de l'annonce et les mises à jour de l'index Vinted (précision ≈ ±30 s).
      « Vendue ? » = annonce disparue des résultats avant la fin de sa fenêtre.
      Favoris aux paliers (5, 10, 15 min) interpolés entre les deux relevés qui les encadrent.
      Score = médiane des favoris × min(annonces, 5)/5 + 2 × hits + 3 × vendues ?. Lignes orange = au moins un hit. Clique sur une colonne pour trier.</div></div>
  <div class="card"><h2>Annonces</h2><div id="ti"></div></div>`;
  const draw = () => {
    $("#tb").innerHTML = table("brands", BRAND_COLS, brandRows(d.brands), "score", brandRowClass);
    $("#ti").innerHTML = table("items", itemCols(win, M.checkpoints(win), d.live), d.items, "rank_value", i => i.is_hit ? "hit" : "");
    bindTables($("#app"), draw);
  };
  draw();
  document.querySelectorAll("[data-exp]").forEach(b => b.onclick = () => exportLocal(s.id, b.dataset.exp));
  const del = $("#del");
  if (del) del.onclick = async () => {
    if (!confirm(`Supprimer définitivement la veille #${s.id} ?`)) return;
    await api(`/api/sessions/${s.id}`, {method: "DELETE"}).then(() => location.hash = "#historique").catch(e => alert(e.message));
  };
  if (d.live) kick();
  if (d.live) pollTimer = setTimeout(() => { if (token === renderToken) viewSession(id, token); }, s.demo ? 3000 : 10000);
}

/* ---------- historique ---------- */
async function viewHistory(token) {
  const list = await api("/api/sessions").catch(() => []);
  if (token !== renderToken) return;
  $("#navdot").classList.toggle("hidden", !list.some(x => x.status === "running"));
  $("#app").innerHTML = `<div class="card"><h2>Historique des veilles</h2>
    ${list.length ? `<div class="hist">${list.map(s => `
      <div class="h card" style="margin:0;box-shadow:none">
        <div><div class="top"><b>#${s.id}</b><span class="muted small">${dt(s.created_at)}</span>
          <span class="st ${s.status}">${STATUS[s.status] || s.status}</span>${s.demo ? '<span class="chip orange">DÉMO</span>' : ""}</div>
          <div style="font-weight:600;margin-top:4px">${esc(s.filters_label)}</div>
          <div class="meta">${nf(s.n_items)} annonces (${nf(s.per_hour, 0)}/h) · ${s.duration_min} min, fenêtre ${s.window_min} min, seuil ${s.hit_threshold}</div>
          <div class="demand"><span title="Favoris médians à ${s.window_min} min"><b>${nf(s.fav_median, 1)}</b> fav. méd.</span><span title="10 % des annonces font au moins ça"><b>${nf(s.fav_p90)}</b> fav. top 10 %</span><span><b style="color:var(--hit-line)">${nf(s.hit_rate, 1)} %</b> de hits (${nf(s.n_hits)})</span>${s.n_gone ? `<span><b style="color:var(--ok)">${nf(s.n_gone)}</b> vendues ?</span>` : ""}</div>
          <div class="chips">${s.top_brands.length ? s.top_brands.map((b, i) => `<span class="chip ${b.hits ? "orange" : ""}">${["🥇", "🥈", "🥉"][i]} ${esc(b.brand)} · ${nf(b.score, 1)}</span>`).join("") : `<span class="chip gray">aucune annonce</span>`}</div></div>
        <div class="row"><a class="btn sm" href="#session/${s.id}">Voir</a>
          ${s.status === "running" ? "" : `<button class="btn ghost sm" data-del="${s.id}" title="Supprimer">🗑</button>`}</div>
      </div>`).join("")}</div>` : `<div class="empty">Aucune veille pour l'instant. <a href="#veille">Lance la première →</a></div>`}
  </div>`;
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(`Supprimer définitivement la veille #${b.dataset.del} ?`)) return;
    await api(`/api/sessions/${b.dataset.del}`, {method: "DELETE"}).catch(e => alert(e.message));
    route();
  });
}

fetch("/api/info").then(r => r.json()).then(i => { INFO = i; if (i.server_time) L.clockOffset = i.server_time - Date.now() / 1000; }).catch(() => {}).finally(route);
</script>
</body>
</html>
